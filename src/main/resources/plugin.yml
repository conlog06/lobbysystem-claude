name: LobbySystem
version: '${project.version}'
main: de.crafterteam.lobbysystem.LobbySystem
api-version: '1.21'
author: SujucDerBreite
softdepend: [PlaceholderAPI, Vault, LuckPerms]
description: Modernes LobbySystem für Paper 1.21.10 – 26.3
website: https://github.com/conlog06/lobbysystem-claude

# Permissions werden NICHT hier vergeben – sie sind frei in der config.json
# (permissions.prefix + permissions.suffix_*) einstellbar.
commands:
  build:
    description: De-/aktiviert den Baumodus
    usage: /build [Spieler]
  lobbycoins:
    description: Vergebe, entferne oder zeige Coins an
    usage: /lobbycoins <add|remove|set|get> <Spieler> [Coins]
    aliases: [lcoins]
  setreward:
    description: Setzt die Daily-Reward Hexe oder entfernt sie
    usage: /setreward [remove]
  setsettings:
    description: Setzt den Einstellungs-Dorfbewohner oder entfernt ihn
    usage: /setsettings [remove]
  setspawn:
    description: Setzt den Spawn-Punkt
    usage: /setspawn
  setwarp:
    description: Setzt, entfernt oder listet Warp-Punkte
    usage: /setwarp <Name> | /setwarp remove <Name> | /setwarp list
  warp:
    description: Teleportiert dich zu einem Warp-Punkt
    usage: /warp <Name>
  spawn:
    description: Teleportiert dich zum Spawn
    usage: /spawn
    aliases: [l, lobby]
  tpcoord:
    description: Teleportiert dich zu Koordinaten
    usage: /tpcoord <x> <y> <z> [Welt] [Yaw] [Pitch]
  license:
    description: Lizenzverwaltung (nur Owner)
    usage: /license <create|list|info|verify>
    aliases: [lizenz]
  friend:
    description: Freundesystem
    usage: /friend <add|remove|accept|deny|list|requests|jump|msg|toggle>
    aliases: [f, freunde, friends]
  party:
    description: Party-System
    usage: /party <invite|accept|deny|leave|kick|promote|disband|list|warp|chat>
    aliases: [p]
  clan:
    description: Clan-System
    usage: /clan <create|invite|accept|deny|leave|kick|promote|demote|disband|info|chat>
    aliases: [clans]
  lobbyswitcher:
    description: Öffnet den Lobby-Switcher
    usage: /lobbyswitcher
    aliases: [lobbies, hubs]
  pay:
    description: Coins an einen Spieler überweisen
    usage: /pay <Spieler> <Coins>
  setleaderboard:
    description: Setzt oder entfernt eine Bestenliste (Hologramm)
    usage: /setleaderboard [remove] <coins|playtime|streak|friends>
  cookie:
    description: Cookie Clicker – Kekse backen & leveln
    usage: /cookie
    aliases: [kekse, cookies, cookieclicker]
  level:
    description: Zeigt dein Lobby-Level
    usage: /level [Spieler]
  rankshop:
    description: Rang-Shop – Ränge für Coins kaufen
    usage: /rankshop
    aliases: [rangshop, ränge, raenge, ranks]
  lobbysystem:
    description: Infos & Reload
    usage: /lobbysystem <reload|info>
    aliases: [ls]
